[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
version = "0.1.0"
description = "A knowledge-base question-answering agent with a hand-written RAG core and pluggable OpenAI-compatible providers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
local = ["sentence-transformers>=2.6"]
dev = ["pytest>=8.0"]

[project.scripts]
rag-agent = "rag_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
